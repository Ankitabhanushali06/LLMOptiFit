name: Web app checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m unittest discover -s tests -v
      - name: Load the production artifacts
        run: python -c "from api.service import get_service; assert get_service().catalog.models"
